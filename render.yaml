# Render Blueprint for møteskriver.
#
# Koble repoet til Render → New → Blueprint. Render leser denne fila og
# setter opp tjenesten. Hemmelighetene under er merket sync:false, som
# betyr at Render spør deg om dem i dashbordet i stedet for å lese dem
# herfra — nøkler skal aldri ligge i et repo.

services:
  - type: web
    name: moteskriver
    runtime: node
    # Frankfurt holder data i EU. Samme begrunnelse som for valg av
    # ASR-region: offentlige møter, men norsk redaksjonelt materiale.
    region: frankfurt
    plan: starter          # disk krever betalt instans; free spinner ned
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Jobber og transkripter lagres på den monterte disken under, slik at
      # fire timer transkribering ikke må gjøres om igjen ved neste deploy.
      - key: DATA_DIR
        value: /var/data

      - key: ASR_PROVIDER
        value: assemblyai
      - key: VIDEO_PROVIDER
        value: flowplayer

      # Bare @amedia.no-kontoer slipper inn.
      - key: ALLOWED_DOMAIN
        value: amedia.no
      # Appens egen adresse. Må stemme med Authorized redirect URI i Google.
      - key: PUBLIC_URL
        sync: false
      # Settes i Render-dashbordet, ikke her.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Render lager en tilfeldig verdi. Byttes den, logges alle ut.
      - key: SESSION_SECRET
        generateValue: true

      # Cue-instansen tekstene eksporteres til.
      - key: CUE_HOST
        sync: false
      - key: CUE_PUBLICATION
        sync: false

      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: FLOWPLAYER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

    disk:
      name: moteskriver-data
      mountPath: /var/data
      sizeGB: 5
