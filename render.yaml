services:
  - type: web
    name: raumnes-arrangementer
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        value: sqlite:////data/data.db
      - key: APP_BRUKER
        value: admin
      - key: APP_PASSORD
        sync: false
      - key: APP_BRUKER_JOURNALIST
        sync: false
      - key: APP_PASSORD_JOURNALIST
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_MODEL_INNHOSTING
        value: claude-sonnet-5
