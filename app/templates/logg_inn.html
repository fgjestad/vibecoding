{% extends "base.html" %}
{% block tittel %}Logg inn{% endblock %}

{% block innhold %}
  <h1>Logg inn</h1>
  <p class="undertittel">
    Innlogging trengs bare for å endre noe. Alle kan se oversikten uten passord.
  </p>

  <div class="kort" style="max-width: 380px;">
    {% if feil %}
      <p class="varsel">{{ feil }}</p>
    {% endif %}
    <form class="skjema" method="post" action="/logg-inn">
      <label>Passord
        <input type="password" name="passord" autofocus required />
      </label>
      <div class="skjema-bunn">
        <button type="submit" class="primær">Logg inn</button>
        <a class="knapp" href="/">Avbryt</a>
      </div>
    </form>
  </div>
{% endblock %}
